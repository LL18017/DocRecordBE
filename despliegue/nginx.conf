# ----------------------------------------------------------------------------
# Unica puerta de entrada al despliegue.
#
# Tanto la aplicacion como la API se sirven desde el MISMO origen, y eso no es
# cosmetico: el bundle del navegador se compilo con NEXT_PUBLIC_API_URL=/api,
# una ruta relativa. Gracias a eso (a) la IP publica no queda horneada en el
# bundle -- si cambia, o si manana hay un dominio, no hay que recompilar --, y
# (b) no hay peticiones entre origenes, asi que ningun preflight de CORS entra
# en juego.
# ----------------------------------------------------------------------------

upstream frontend { server frontend:3000; }
upstream backend  { server backend:8080;  }

server {
    listen 80;
    server_name _;

    # Cabecera que delata la version de nginx en cada respuesta.
    server_tokens off;

    # El default de nginx es 1 MB. Una consulta con varias recetas y notas
    # clinicas no se acerca, pero 1 MB es un limite bajo para un POST de
    # formulario y el error que produce (413) no dice nada util.
    client_max_body_size 10M;

    # ── API ────────────────────────────────────────────────────────────────
    # La barra final de proxy_pass es lo que quita el prefijo: el backend
    # expone /auth, /pacientes, /consultas... sin /api delante, de modo que
    # /api/auth/login llega al contenedor como /auth/login.
    location /api/ {
        proxy_pass http://backend/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # El arranque de Spring Boot en esta maquina tarda bastante mas que en
        # una de desarrollo; 60s evita un 504 en la primera peticion tras un
        # reinicio.
        proxy_connect_timeout 60s;
        proxy_read_timeout    60s;
    }

    # ── Aplicacion ─────────────────────────────────────────────────────────
    location / {
        proxy_pass http://frontend;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next.js usa websockets para su canal de actualizacion; sin esto la
        # conexion se cae con un 400 y queda ruido en la consola del navegador.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Los estaticos con hash en el nombre son inmutables por definicion: si el
    # contenido cambia, cambia el nombre. Cachearlos un ano le ahorra a esta
    # instancia -- que no sobra en nada -- servirlos en cada recarga.
    location /_next/static/ {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
