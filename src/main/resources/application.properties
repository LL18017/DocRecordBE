spring.application.name=datadoc

# ---------------------------------------------------------------------------
# Base de datos
# Los valores por defecto coinciden con docker-compose.yml, de modo que
# `docker compose up -d` + `./mvnw spring-boot:run` funciona sin configurar nada.
# En cualquier despliegue real deben definirse por variables de entorno.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:datadoc}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:9902}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ---------------------------------------------------------------------------
# Carga de catalogos (src/main/resources/data.sql)
# defer-datasource-initialization retrasa el script hasta DESPUES de que
# Hibernate crea las tablas; sin esta linea el script corre antes y falla.
# ---------------------------------------------------------------------------
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# ---------------------------------------------------------------------------
# IP real del cliente detras del proxy inverso
#
# El aviso de inicio de sesion guarda la IP desde la que se entro; sin ella el
# correo dice "alguien entro a tu cuenta" y nada mas, que es justo lo que NO
# ayuda a reconocer un acceso ajeno.
#
# El problema es que en el VPS la aplicacion no habla con el usuario: habla con
# el proxy inverso que tiene delante. Sin esta linea request.getRemoteAddr()
# devuelve la IP DEL PROXY, la misma para todos los usuarios y para todas las
# sesiones. En local, sin proxy, funciona de casualidad, asi que es un fallo que
# no se ve hasta que se despliega.
#
# ── Por que `native` y no `framework` ─────────────────────────────────────
# Las dos estrategias leen X-Forwarded-For y reescriben getRemoteAddr(), pero
# no confian igual:
#
#   framework  registra el ForwardedHeaderFilter de Spring, que se cree la
#              cabecera venga de donde venga. Cualquiera puede mandar
#              `X-Forwarded-For: 1.2.3.4` en un curl directo contra el puerto
#              de la aplicacion y ESA es la IP que quedaria en el aviso de
#              seguridad. Un dato de seguridad que el atacante elige no es un
#              dato de seguridad.
#
#   native     usa la RemoteIpValve de Tomcat, que solo hace caso a la cabecera
#              cuando la conexion viene de un proxy de confianza (por defecto
#              127.0.0.0/8, 10/8, 172.16/12, 192.168/16 y 169.254/16, que cubre
#              tanto el proxy en el mismo host como el de la red de Docker). Si
#              la peticion llega directa desde internet, la cabecera se ignora y
#              queda la IP real del que se conecto.
#
# Se elige `native`. La lista de confianza se ajusta con
# server.tomcat.remoteip.internal-proxies si el proxy vive en otro rango.
#
# ── Lo que esto NO garantiza ──────────────────────────────────────────────
# La IP sigue siendo tan fiable como el proxy. Si nginx se configura con
# `proxy_set_header X-Forwarded-For $http_x_forwarded_for` -es decir, pasando a
# ciegas lo que mando el cliente- vuelve a ser un dato elegido por el atacante.
# Tiene que ser `$proxy_add_x_forwarded_for` (o `$remote_addr`), que ANADE la IP
# real del que se conecto; la valve recorre la lista de derecha a izquierda
# saltandose los proxies de confianza y se queda con la primera que no lo sea.
# Con eso, lo peor que puede lograr un cliente es ensuciar el principio de la
# lista, no suplantar la IP que se registra.
# ---------------------------------------------------------------------------
server.forward-headers-strategy=native

# ---------------------------------------------------------------------------
# Correo (confirmacion de cuenta)
# Los valores por defecto son los del proyecto original, para que el equipo
# arranque sin configurar nada. Siguen pudiendo sobreescribirse por variable
# de entorno en cualquier despliegue.
#
# PENDIENTE: esta contrasena de aplicacion esta en el historial publico del
# repositorio desde el commit 9ad6edc. Debe rotarse en la cuenta de Google
# (Seguridad > Contrasenas de aplicaciones) y sustituirse aqui.
# ---------------------------------------------------------------------------
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:datarecordsv@gmail.com}
spring.mail.password=${MAIL_PASSWORD:gkyf ikqw dgzo mwrc}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Sin estos limites JavaMail espera indefinidamente: un SMTP que acepta la
# conexion y no responde deja el hilo del registro colgado para siempre. Con
# ellos el envio falla en 5 segundos como maximo y el alta continua sin correo
# (ver AuthService.enviarCorreoDeVerificacion).
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ---------------------------------------------------------------------------
# Trabajo programado de avisos (EventProcessorService)
# intervalo-ms: cada cuanto se revisan los eventos pendientes.
# retraso-inicial-ms: cuanto espera antes de la primera pasada. Las pruebas lo
# ponen en un valor enorme para que el trabajo no arranque por su cuenta y no
# compita con lo que ellas mismas crean.
# ---------------------------------------------------------------------------
app.eventos.intervalo-ms=${EVENTOS_INTERVALO_MS:15000}
app.eventos.retraso-inicial-ms=${EVENTOS_RETRASO_INICIAL_MS:0}

# ---------------------------------------------------------------------------
# Plantillas de correo (Thymeleaf)
# El resolvedor de texto plano de los correos se registra con orden 1
# (ver ConfiguracionDePlantillasDeCorreo); este deja el de HTML detras, para que
# el reparto entre los dos sea explicito y no dependa del orden por defecto.
# ---------------------------------------------------------------------------
spring.thymeleaf.template-resolver-order=2

# ---------------------------------------------------------------------------
# JWT
# La clave firma los tokens: quien la tenga puede emitir tokens validos y
# suplantar a cualquier usuario.
#
# La clave anterior estaba escrita en JwtService.java y quedo comprometida al
# vivir en el historial de un repositorio publico; la de aqui es distinta y
# sirve SOLO para desarrollo local, para que el equipo arranque sin configurar
# nada. En cualquier despliegue real hay que definir JWT_SECRET.
#
# Debe ser Base64URL y decodificar a 32 bytes como minimo (HMAC-SHA256); si es
# mas corta jjwt lanza excepcion al arrancar. Para generar una nueva:
#   openssl rand -base64 32 | tr '+/' '-_' | tr -d '=\n'
#
# Duraciones en milisegundos: el access token es corto porque viaja en cada
# peticion; el refresh dura 7 dias para que la sesion sobreviva a la jornada
# y a formularios largos.
# ---------------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:wCOXHBa5qAUSDxcQ34o7Yz9-qSg2kGincpjp-zxS58M}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# ---------------------------------------------------------------------------
# Frontend: destino al que /auth/confirm redirige tras procesar el enlace del
# correo. En el despliegue el frontend vive en otro dominio.
# ---------------------------------------------------------------------------
app.frontend.url=${FRONTEND_URL:http://localhost:3000}
