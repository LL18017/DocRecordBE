spring.application.name=datadoc
spring.datasource.url=${DATADOC_DB_URL:jdbc:postgresql://192.168.20.130:5432/datadoc}
spring.datasource.username=${DATADOC_DB_USER:datadoc}
spring.datasource.password=${DATADOC_DB_PASSWORD:12345}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ---------------------------------------------------------------------------
# Carga de catalogos (src/main/resources/data.sql)
# defer-datasource-initialization retrasa el script hasta DESPUES de que
# Hibernate crea las tablas; sin esta linea el script corre antes y falla.
# ---------------------------------------------------------------------------
spring.jpa.defer-datasource-initialization=true
